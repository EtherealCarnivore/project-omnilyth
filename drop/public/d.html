<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="robots" content="noindex">
  <title>Omnilyth Drop</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <img class="logo" src="/icon.svg" alt="">
    <h1>Omnilyth Drop</h1>
    <span class="spacer"></span>
    <button class="pill" id="recent-btn" type="button">Recent<b id="recent-n">0</b></button>
  </header>

  <main>
    <section class="screen active" id="s-load">
      <div class="card"><p>Checking link…</p></div>
    </section>

    <section class="screen" id="s-file">
      <div class="card">
        <div class="file-name" id="name">Encrypted file</div>
        <p class="muted" id="size"></p>
        <p class="muted" style="margin-top:8px">Expires in <span id="cd">—</span></p>
      </div>
      <button class="primary" id="save" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0 4-4m-4 4-4-4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        Save file
      </button>
      <p class="muted" style="text-align:center" id="hint"></p>
    </section>

    <section class="screen" id="s-dl">
      <div class="card">
        <div class="file-name" id="dl-name"></div>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <div class="stat"><span id="stage">Downloading…</span><span id="pct">0%</span></div>
    </section>

    <section class="screen" id="s-ok">
      <div class="card" style="text-align:center">
        <h2 class="ok">Saved</h2>
        <p id="ok-name"></p>
      </div>
    </section>

    <section class="screen" id="s-recent">
      <div class="recent-list" id="recent-list"></div>
      <button class="ghost" id="recent-back" type="button">Back</button>
    </section>

    <section class="screen" id="s-gone">
      <div class="card">
        <h2>Link expired</h2>
        <p id="gone-msg">Files are kept for 10 minutes only. Ask the sender for a new link.</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script type="module" src="/dl.js"></script>
</body>
</html>
