name = "omnilyth-drop"
main = "src/worker.js"
compatibility_date = "2025-09-01"
account_id = "de762c1447c2671cda02a6d5412acf1c"

# Worker custom domain: Cloudflare creates the DNS record + cert itself
# (omnilyth.app is already a CF zone, same as api.omnilyth.app).
routes = [
  { pattern = "drop.omnilyth.app", custom_domain = true },
]

# Static PWA (login / upload / download pages). run_worker_first lets the
# Worker gate "/" behind the password cookie before an asset is served.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Encrypted blobs live here for at most 10 minutes.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "omnilyth-drop"

# Upload + file metadata with TTL (`wrangler dev` uses a local emulation).
[[kv_namespaces]]
binding = "KV"
id = "03898fd60a1e42f3a64261205f4f922c"

# Login brute-force limit: 5 attempts per IP per minute (edge-enforced).
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Sweeper: deletes anything older than 10 minutes.
[triggers]
crons = ["*/5 * * * *"]

[vars]
MAX_BYTES = "1073741824"     # 1 GiB hard cap per upload
TTL_SECONDS = "600"          # 10 minutes
